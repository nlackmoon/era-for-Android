<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><title>era for Android</title>
<style>
:root{--ink:#e8f0e0;--muted:#a9b79e;--accent:#c8eead;--panel:rgba(12,16,10,.9);--line:rgba(255,255,255,.09)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#000;color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans SC',sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
button,input{font:inherit}button{border:0;color:inherit;cursor:pointer;background:none}
svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#stage{position:fixed;inset:0;overflow:hidden;background:#000;touch-action:none}
#screen{position:absolute;left:0;bottom:0;width:100%;height:100%;object-fit:fill;transform-origin:center center;pointer-events:none;will-change:transform;-webkit-user-drag:none}
#float{position:absolute;right:calc(10px + env(safe-area-inset-right));top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;z-index:6;transition:opacity .35s}
#float.dim{opacity:.26}
.ico{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;padding:0;color:var(--ink);background:rgba(14,18,12,.55);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:transform .12s,background .16s}
.ico:active{transform:scale(.92);background:rgba(40,52,33,.8)}
.ico.skip{background:rgba(200,238,173,.88);color:#1b2416;border-color:transparent}
#status{position:absolute;left:calc(10px + env(safe-area-inset-left));top:calc(8px + env(safe-area-inset-top));z-index:5;display:flex;align-items:center;gap:7px;font-size:11px;line-height:1;padding:8px 11px;border-radius:20px;background:rgba(12,16,10,.5);border:1px solid var(--line);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);opacity:.9;max-width:46vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#status i{width:6px;height:6px;border-radius:50%;background:#a8d98a;flex:none}
#status.bad i{background:#ff9d94}
#status.busy i{background:#e8d38a;animation:pulse 1s infinite}
#status.idle{opacity:.3;transition:opacity .4s}
@keyframes pulse{50%{opacity:.3}}
#latest{position:absolute;left:calc(12px + env(safe-area-inset-left));bottom:calc(12px + env(safe-area-inset-bottom));z-index:4;border-radius:22px;padding:9px 15px;font-size:12px;border:1px solid rgba(200,238,173,.45);background:rgba(20,26,16,.82);color:var(--accent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
#latest[hidden]{display:none}
#pad{position:absolute;right:calc(8px + env(safe-area-inset-right));bottom:calc(8px + env(safe-area-inset-bottom));width:min(192px,46vw);z-index:7;display:flex;flex-direction:column;gap:6px;padding:6px;border-radius:16px;background:rgba(8,10,7,var(--pad-a,.28));border:1px solid rgba(255,255,255,.14);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#pad.off{display:none}
.inrow{display:flex;gap:6px}
#text{flex:1;min-width:0;height:34px;border-radius:9px;border:1px solid rgba(255,255,255,.16);background:rgba(0,0,0,.32);color:var(--ink);padding:0 9px;font-size:13px;outline:none}
#text:focus{border-color:rgba(200,238,173,.6)}
#send{height:34px;padding:0 10px;border-radius:9px;background:rgba(200,238,173,.86);color:#1b2416;font-weight:650;font-size:12px;flex:none}
#send:disabled{opacity:.4}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}
.keys button{height:38px;border-radius:10px;background:rgba(25,32,21,var(--pad-k,.38));border:1px solid rgba(255,255,255,.16);font-size:16px;color:var(--ink);transition:transform .1s,background .16s;backdrop-filter:blur(1px);-webkit-backdrop-filter:blur(1px)}
.keys button:active{transform:scale(.94);background:rgba(80,100,65,.6)}
.keys button.util{font-size:12px;color:#c4d3b8}
#choices{position:fixed;right:calc(8px + env(safe-area-inset-right));top:calc(58px + env(safe-area-inset-top));max-height:calc(100% - 74px - env(safe-area-inset-bottom));width:var(--cw,236px);z-index:8;display:grid;grid-template-columns:repeat(var(--cols,1),minmax(0,1fr));align-content:start;gap:calc(6px * var(--cs,1));overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:2px;scrollbar-width:none}
#choices[hidden]{display:none}
#choices button{min-width:0;width:100%;text-align:left;padding:calc(9px * var(--cs,1)) calc(11px * var(--cs,1));border-radius:calc(11px * var(--cs,1));background:rgba(8,10,7,.30);border:1px solid rgba(255,255,255,.18);color:var(--ink);font-size:calc(13px * var(--cs,1));line-height:1.35;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);display:block;overflow:hidden}
#choices .ctext{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-overflow:ellipsis;word-break:break-word}
#choices button:active{background:rgba(80,100,65,.55)}
.seg{display:flex;border:1px solid rgba(255,255,255,.16);border-radius:9px;overflow:hidden;flex:none}
.seg button{padding:6px 12px;font-size:12px;background:rgba(0,0,0,.25);color:var(--muted)}
.seg button.on{background:rgba(200,238,173,.85);color:#1b2416;font-weight:650}
#sheet{position:fixed;inset:0;z-index:9;overscroll-behavior:contain;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
#sheet[hidden]{display:none}
.card{width:100%;max-width:720px;-webkit-overflow-scrolling:touch;background:#141a10;border:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 18px calc(12px + env(safe-area-inset-bottom));animation:up .22s ease;max-height:96%;overflow:auto}
@keyframes up{from{transform:translateY(26px);opacity:.5}}
.card h3{margin:0 0 2px;font-size:15px;font-weight:650;color:#dcead2}
.card p{margin:0 0 4px;font-size:10px;color:var(--muted);line-height:1.55}
.rows{display:grid;grid-template-columns:1fr;column-gap:22px}
.row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:5px 0;font-size:14px}
@media(min-width:700px){.rows{grid-template-columns:1fr 1fr}}
.row output{font-size:12px;color:var(--muted);min-width:38px;text-align:right}
.sw{width:46px;height:26px;border-radius:14px;background:#39452f;position:relative;flex:none;transition:background .18s}
.sw:after{content:'';position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#a8b49c;transition:.18s}
.sw[aria-checked=true]{background:#4f7a3b}
.sw[aria-checked=true]:after{left:23px;background:#dff5cd}
input[type=range]{flex:1;min-width:0;accent-color:#8fc56c;margin:0}
.btnrow{display:flex;gap:8px;margin-top:6px}.btnrow .wide{margin-top:0;flex:1}
.wide{width:100%;margin-top:6px;height:34px;border-radius:12px;background:#222b1b;border:1px solid rgba(255,255,255,.1);color:#dbe8d2;font-size:14px}
.wide.primary{background:var(--accent);color:#1b2416;font-weight:650;border:0}
#toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:rgba(24,30,20,.95);border:1px solid rgba(255,255,255,.1);color:var(--ink);padding:10px 16px;border-radius:14px;font-size:13px;line-height:1.5;max-width:78vw;opacity:0;pointer-events:none;transition:.2s;z-index:11;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-height:430px){.card p{display:none}.card h3{margin-bottom:6px}}
@media(min-width:700px){#sheet{align-items:center}.card{border-radius:18px}}
@media(max-height:340px){.ico{width:36px;height:36px}#status{font-size:10px;padding:6px 9px}}
</style></head><body>
<svg style="display:none"><symbol id="i-back" viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></symbol><symbol id="i-keys" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="4"/><path d="M7 9h.1M11 9h.1M15 9h.1M7 13h.1M11 13h.1M15 13h.1M7 17h10"/></symbol><symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h7m4 0h5M4 17h3m4 0h9"/><circle cx="13" cy="7" r="2"/><circle cx="9" cy="17" r="2"/></symbol><symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol><symbol id="i-skip" viewBox="0 0 24 24"><path d="M5 6l6 6-6 6M13 6l6 6-6 6"/></symbol><symbol id="i-del" viewBox="0 0 24 24"><path d="M3 12l5-7h13v14H8zM12 9l6 6m0-6-6 6"/></symbol></svg>
<div id="stage">
 <img id="screen" alt="游戏画面" draggable="false">
 <div id="status"><i></i><span id="statustext">连接中</span></div>
 <div id="float">
  <button class="ico skip" id="skip" aria-label="跳过对话"><svg><use href="#i-skip"/></svg></button>
  <button class="ico" id="back" aria-label="返回游戏库"><svg><use href="#i-back"/></svg></button>
  <button class="ico" id="keys" aria-label="数字键盘"><svg><use href="#i-keys"/></svg></button>
  <button class="ico" id="menu" aria-label="设置"><svg><use href="#i-menu"/></svg></button>
 </div>
 <button id="latest" hidden>回到最新 ↓</button>
 <aside id="pad" aria-label="数字键盘">
  <div class="inrow"><input id="text" type="text" inputmode="none" autocomplete="off" placeholder="输入数字" maxlength="2000"><button id="send" disabled><span id="sendlabel">确认</span></button></div>
  <div class="keys">
   <button data-key="1">1</button><button data-key="2">2</button><button data-key="3">3</button>
   <button data-key="4">4</button><button data-key="5">5</button><button data-key="6">6</button>
   <button data-key="7">7</button><button data-key="8">8</button><button data-key="9">9</button>
   <button class="util" id="kb" aria-label="文字键盘">文</button><button data-key="0">0</button><button class="util" id="del" aria-label="退格"><svg><use href="#i-del"/></svg></button>
  </div>
 </aside>
</div>
<aside id="choices" hidden aria-label="游戏选项"></aside>
 <div id="sheet" hidden>
  <div class="card">
   <h3>显示设置</h3>
   <p>屏幕大小缩放整个游戏窗口；字号由游戏自身的 emuera.config 决定。按钮几秒后会自动变淡。</p>
 <div class="rows">
   <div class="row"><span>屏幕大小</span><input id="zoom" type="range" min="70" max="130" step="5" value="100"><output id="zoomval">100%</output></div>
   <div class="row"><span>缩放方式</span><div class="seg"><button id="fit-fill" class="on">铺满</button><button id="fit-contain">等比</button></div></div>
   <div class="row"><span>显示游戏图片</span><button class="sw" id="sw-images" role="switch" aria-checked="true" aria-label="显示游戏图片"></button></div>
   <div class="row"><span>按键振动</span><button class="sw" id="sw-haptic" role="switch" aria-checked="true" aria-label="按键振动"></button></div>
   <div class="row"><span>常驻数字键盘</span><button class="sw" id="sw-pad" role="switch" aria-checked="true" aria-label="常驻数字键盘"></button></div>
   <div class="row"><span>显示选项面板</span><button class="sw" id="sw-choices" role="switch" aria-checked="true" aria-label="显示选项面板"></button></div>
   <div class="row"><span>键盘透明度</span><input id="padalpha" type="range" min="15" max="70" step="5" value="35"><output id="padalphaval">35%</output></div>
   <div class="row"><span>选项列数</span><div class="seg" id="choicecols"><button data-cols="1">1</button><button data-cols="2" class="on">2</button><button data-cols="3">3</button></div></div>
   <div class="row"><span>选项块大小</span><input id="choicescale" type="range" min="70" max="130" step="5" value="100"><output id="choicescaleval">100%</output></div>
 </div>
   <div class="btnrow"><button class="wide" id="reset">恢复默认显示</button><button class="wide" id="savehelp">存档与进度</button></div>
   <button class="wide primary" id="done">完成</button>
  </div>
 </div>
 <div id="toast" role="status"></div>

<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const stage=$('stage'),screen=$('screen'),text=$('text'),pad=$('pad'),sheet=$('sheet');
const token=new URLSearchParams(location.search).get('token');
let ws=null,mode='loading',single=false,inflight=false,ready=false,manualKb=false;
let setting={scale:1,images:true,haptic:true,pad:true,padAlpha:.35,fit:'fill',choiceScale:1,choiceCols:2,showChoices:true};let choicesVisible=false,padSuppressed=false,lastChoices=[];
let engineW=1000,engineH=420,lineHeight=20,pan=0,zoom=1,scrollPos=0,scrollMax=0;
let frameURL=null,toastTimer=0,retryTimer=0,resizeTimer=0,dimTimer=0,retries=0;

function native(action,value){try{window.Android&&window.Android.call(JSON.stringify({action,value}));}catch(e){}}
function haptic(){if(setting.haptic)native('haptic');}
function send(v){if(ws&&ws.readyState===1){ws.send(JSON.stringify(v));return true}return false;}
function toast(s){const t=$('toast');t.textContent=s;t.classList.add('on');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('on'),2800);}
let statusTimer=0;
function setStatus(s,bad,busy){
 const el=$('status');$('statustext').textContent=s;el.classList.toggle('bad',!!bad);el.classList.toggle('busy',!!busy);el.classList.remove('idle');
 clearTimeout(statusTimer);
 if(!bad&&!busy)statusTimer=setTimeout(()=>el.classList.add('idle'),4000);
}

function syncFit(){
 const contain=setting.fit==='contain';
 $('fit-fill').classList.toggle('on',!contain);
 $('fit-contain').classList.toggle('on',contain);
}
function applySettings(){
 setting.scale=Math.max(.7,Math.min(1.3,Number(setting.scale)||1));
 zoom=setting.scale;pan=0;layout();
 $('zoom').value=Math.round(zoom*100);$('zoomval').value=Math.round(zoom*100)+'%';
  syncFit();
 $('sw-images').setAttribute('aria-checked',String(!!setting.images));
 $('sw-haptic').setAttribute('aria-checked',String(!!setting.haptic));
 setting.padAlpha=Math.max(.12,Math.min(.7,Number(setting.padAlpha)||.35));
 $('padalpha').value=Math.round(setting.padAlpha*100);$('padalphaval').value=Math.round(setting.padAlpha*100)+'%';
 applyChoiceLayout();
 syncPad();
 send({t:'images',v:!!setting.images});
}
function layout(){
 const contain=setting.fit==='contain';
 screen.style.objectFit=contain?'contain':'fill';
 if(contain){
  // 等比：不拉伸，交给 object-fit:contain 保持比例居中，四周留黑边。
  screen.style.transform='none';
  pan=0;
 }else{
  // 铺满：整图拉伸铺满；zoom 继续用中心缩放。
  const m=Math.max(0,stage.clientWidth*(zoom-1)/2);
  pan=Math.max(-m,Math.min(m,pan));
  screen.style.transform='translateX('+pan+'px) scale('+zoom+')';
 }
}
function applyChoiceLayout(){
 setting.choiceScale=Math.max(.7,Math.min(1.3,Number(setting.choiceScale)||1));
 setting.choiceCols=Math.max(1,Math.min(3,Number(setting.choiceCols)||2));
 const cs=setting.choiceScale,cols=setting.choiceCols,gap=6*cs,box=$('choices');
 const maxW=Math.max(180,stage.clientWidth-16);
 const base=cols===1?236:150;
 const bw=Math.max(78,base*cs);
 box.style.width=Math.min(maxW,cols*bw+(cols-1)*gap)+'px';
 box.style.setProperty('--cs',cs);
 box.style.setProperty('--cols',cols);
 box.style.gridTemplateColumns=`repeat(${cols},minmax(0,1fr))`;
 $('choicescale').value=Math.round(cs*100);$('choicescaleval').value=Math.round(cs*100)+'%';
 document.querySelectorAll('#choicecols [data-cols]').forEach(b=>b.classList.toggle('on',Number(b.dataset.cols)===cols));
}
function resize(){
 layout();applyChoiceLayout();clearTimeout(resizeTimer);
 resizeTimer=setTimeout(()=>{
  const dpr=Math.min(3,Math.max(1,window.devicePixelRatio||1));
  send({t:'resize',w:Math.max(200,Math.round(stage.clientWidth*dpr)),h:Math.max(200,Math.round(stage.clientHeight*dpr))});
 },150);
}
new ResizeObserver(resize).observe(stage);

const LABELS={loading:'加载中',busy:'运行中',integer:'数字输入',string:'文字输入',any:'等待输入',enter:'点屏幕继续',mouse:'选择选项',void:'等待中',none:'就绪',error:'游戏错误',nomouse:'数字输入'};
function setMode(v){
 mode=v;ready=['integer','string','any','enter','mouse','nomouse'].includes(v);
 if(v!=='busy')inflight=false;
 setStatus(single?'单键输入':(LABELS[v]||'就绪'),v==='error',v==='busy');
 text.inputMode=(v==='string'||manualKb)?'text':'none';
 text.placeholder=v==='string'?'输入文字':v==='enter'?'点屏幕继续':'输入数字';
 $('sendlabel').textContent=v==='enter'?'继续':'确认';
 updateSend();
}
function updateSend(){$('send').disabled=!ready||inflight||!ws||ws.readyState!==1;}

function connect(){
 clearTimeout(retryTimer);
 if(ws){ws.onclose=null;try{ws.close()}catch(e){}}
 setStatus('连接中',false,false);
 ws=new WebSocket('ws://'+location.host+'/ws'+(token?'?token='+encodeURIComponent(token):''));
 ws.binaryType='arraybuffer';
 ws.onopen=()=>{retries=0;send({t:'hello',binary:true});send({t:'images',v:!!setting.images});resize();};
 ws.onmessage=e=>{
  if(e.data instanceof ArrayBuffer){frame(e.data);return;}
  let m;try{m=JSON.parse(e.data)}catch(_){return}
  switch(m.t){
   case 'title':document.title=m.v+' · era for Android';break;
   case 'metrics':engineW=Math.max(1,m.w||engineW);engineH=Math.max(1,m.h||engineH);lineHeight=Math.max(1,m.lineHeight||lineHeight);layout();break;
   case 'state':single=!!m.single;setMode(m.v);setChoices(m.choices);break;
   case 'input':text.value=m.v||'';break;
   case 'tap':inflight=false;updateSend();break;
   case 'scrollstate':setScroll(m.s,m.max);break;
   case 'tip':if(m.v)toast(m.v);break;
   case 'close':toast('本次游戏已结束');break;
   case 'reboot':toast('请返回游戏库重新打开');break;
   case 'error':toast(m.v);setMode('error');break;
  }
 };
 ws.onclose=()=>{ready=false;inflight=false;updateSend();setStatus('连接已断开',true,false);if(retries++<3)retryTimer=setTimeout(connect,1000);else{setStatus('已断开 · 点此重连',true,false);toast('连接已断开，可点左上角重连');}};
 ws.onerror=()=>{};
}

function frame(buf){
 const d=new DataView(buf);if(d.byteLength<16||d.getUint8(0)!==69||d.getUint8(1)!==77)return;
 setScroll(d.getInt32(8,true),d.getInt32(12,true));
 const blob=new Blob([buf.slice(16)],{type:'image/png'}),url=URL.createObjectURL(blob);
 const img=new Image();
 img.onload=()=>{
  // 画像は描画倍率ぶん大きい。クリック座標の基準は metrics の論理サイズのまま。
  const old=frameURL;frameURL=url;screen.src=url;
  if(old)URL.revokeObjectURL(old);
  send({t:'ack'});
 };
 img.onerror=()=>{URL.revokeObjectURL(url);send({t:'ack'})};
 img.src=url;
}
function setScroll(s,max){s=Number(s)||0;max=Number(max)||0;scrollPos=s;scrollMax=max;$('latest').hidden=s>=max;}

function syncPad(){
 // 选项面板显示时收起数字键盘；否则按常驻开关显示。
 pad.classList.toggle('off',!setting.pad||padSuppressed);
 pad.style.setProperty('--pad-a',setting.padAlpha);
 pad.style.setProperty('--pad-k',Math.min(.72,setting.padAlpha+.12));
 $('sw-pad').setAttribute('aria-checked',String(!!setting.pad));
 $('sw-choices').setAttribute('aria-checked',String(!!setting.showChoices));
}
function setChoices(list){
 const box=$('choices'),arr=Array.isArray(list)?list:[];
 lastChoices=arr;
 choicesVisible=arr.length>0 && setting.showChoices;
 padSuppressed=choicesVisible;
 if(!choicesVisible){box.hidden=true;box.innerHTML='';syncPad();return;}
 box.innerHTML=arr.map(c=>{const raw=String(c.text||c.value||'').trim();const label=raw.replace(/^\[(\d+)\]\s*/,'$1  ');return `<button data-choice="${esc(String(c.value??''))}" title="${esc(label)}"><span class="ctext">${esc(label)}</span></button>`}).join('');
 applyChoiceLayout();
 box.hidden=false;
 box.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{haptic();text.value=b.dataset.choice;submit();});
 syncPad();
}
function openSheet(){sheet.hidden=false;}
function submit(){
 if($('send').disabled)return;
 const v=text.value.trim();
 if(!v&&(mode==='integer'||mode==='nomouse')){toast('先输入选项数字');return;}
 if(v&&(mode==='integer'||mode==='nomouse')&&!/^[-+]?\d+$/.test(v)){toast('请输入整数');return;}
 inflight=true;updateSend();haptic();
 if(mode==='enter')send({t:'enter'});else send({t:'submit',v:v});
 text.value='';text.blur();
}
function wake(){const f=$('float');f.classList.remove('dim');clearTimeout(dimTimer);dimTimer=setTimeout(()=>f.classList.add('dim'),5000);}

document.querySelectorAll('[data-key]').forEach(b=>b.onclick=()=>{
 if(single){if(!ready||inflight)return;text.value=b.dataset.key;submit();return;}
 haptic();text.value+=b.dataset.key;text.dispatchEvent(new Event('input'));
});
$('del').onclick=()=>{haptic();text.value=text.value.slice(0,-1)};
$('del').oncontextmenu=e=>{e.preventDefault();text.value=''};
$('kb').onclick=()=>{manualKb=!manualKb;text.inputMode=manualKb?'text':'none';if(manualKb){text.focus();toast('可输入文字、负数或粘贴内容')}else text.blur()};
$('send').onclick=submit;
$('keys').onclick=()=>{haptic();setting.pad=!setting.pad;syncPad();native('settings',setting)};
$('menu').onclick=()=>{haptic();openSheet()};
$('skip').onclick=()=>{haptic();send({t:'skipall'})};
$('back').onclick=()=>native('home');
$('done').onclick=()=>{sheet.hidden=true};
$('latest').onclick=()=>send({t:'latest'});
$('status').onclick=()=>{if(!ws||ws.readyState>1)connect()};
$('sheet').onclick=e=>{if(e.target===$('sheet'))sheet.hidden=true};
$('zoom').oninput=()=>{setting.scale=Number($('zoom').value)/100;zoom=setting.scale;$('zoomval').value=$('zoom').value+'%';layout()};
$('fit-fill').onclick=()=>{setting.fit='fill';syncFit();layout();native('settings',setting)};
$('fit-contain').onclick=()=>{setting.fit='contain';syncFit();layout();native('settings',setting)};
$('zoom').onchange=()=>native('settings',setting);
$('sw-images').onclick=()=>{setting.images=!setting.images;applySettings();native('settings',setting)};
$('sw-haptic').onclick=()=>{setting.haptic=!setting.haptic;applySettings();native('settings',setting)};
$('sw-pad').onclick=()=>{setting.pad=!setting.pad;syncPad();native('settings',setting)};
$('sw-choices').onclick=()=>{setting.showChoices=!setting.showChoices;syncPad();setChoices(lastChoices);native('settings',setting)};
$('padalpha').oninput=()=>{setting.padAlpha=Number($('padalpha').value)/100;$('padalphaval').value=$('padalpha').value+'%';syncPad()};
$('padalpha').onchange=()=>native('settings',setting);
$('choicescale').oninput=()=>{setting.choiceScale=Number($('choicescale').value)/100;applyChoiceLayout()};
document.querySelectorAll('#choicecols [data-cols]').forEach(b=>b.onclick=()=>{setting.choiceCols=Number(b.dataset.cols);applyChoiceLayout();native('settings',setting)});
$('choicescale').onchange=()=>native('settings',setting);
$('reset').onclick=()=>{setting.scale=1;setting.fit='fill';setting.images=true;setting.pad=true;setting.padAlpha=.35;setting.choiceScale=1;setting.choiceCols=2;setting.showChoices=true;applySettings();native('settings',setting)};
$('savehelp').onclick=()=>toast('用游戏内菜单存档；游戏库可导出/恢复存档备份');

text.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}});
document.addEventListener('keydown',e=>{
 if(document.activeElement===text)return;
 if(e.key==='Enter'){e.preventDefault();submit();}
 else if(/^\d$/.test(e.key)){if(single){text.value=e.key;submit();}else{text.value+=e.key;}e.preventDefault();}
 else if(e.key==='Backspace'){text.value=text.value.slice(0,-1);e.preventDefault();}
 else if(e.key==='Escape'){sheet.hidden=true;}
});

let g=null,scrollPending=0,scrollTick=0;
function queueScroll(n){scrollPending+=n;if(!scrollTick)scrollTick=setTimeout(()=>{send({t:'scrollLines',n:scrollPending});scrollPending=0;scrollTick=0},35)}
stage.addEventListener('pointerdown',e=>{
 if(e.target.closest('button,input,#pad,#sheet,#float,#status'))return;
 wake();
 g={id:e.pointerId,x:e.clientX,y:e.clientY,lx:e.clientX,ly:e.clientY,moved:false,t:performance.now()};
 try{stage.setPointerCapture(e.pointerId)}catch(_){}
});
stage.addEventListener('pointermove',e=>{
 if(!g||g.id!==e.pointerId)return;
 const dx=e.clientX-g.lx,dy=e.clientY-g.ly;
 if(Math.hypot(e.clientX-g.x,e.clientY-g.y)>8)g.moved=true;
 if(g.moved){
  if(Math.abs(e.clientX-g.x)>Math.abs(e.clientY-g.y)+6&&zoom>1){pan+=dx;layout();}
  else{
   const r=screen.getBoundingClientRect();
   const px=Math.max(10,lineHeight*(r.width/engineW));
   const n=Math.trunc(dy/px);
   if(n){queueScroll(n);g.ly=e.clientY;}
  }
  g.lx=e.clientX;
 }
});
stage.addEventListener('pointerup',e=>{
 if(!g)return;
 const moved=g.moved,dur=performance.now()-g.t,x=e.clientX,y=e.clientY;
 g=null;
 if(moved||!ready||inflight)return;
 const r=screen.getBoundingClientRect();
 if(r.width<=0||r.height<=0)return;
 const gx=Math.round((x-r.left)*engineW/r.width),gy=Math.round((y-r.top)*engineH/r.height);
 if(gx<0||gy<0||gx>=engineW||gy>=engineH)return;
 inflight=true;updateSend();
 send({t:'click',x:gx,y:gy,right:dur>600,id:Date.now()%1000000});
});
stage.addEventListener('pointercancel',()=>{g=null});
stage.addEventListener('contextmenu',e=>e.preventDefault());
stage.addEventListener('wheel',e=>{e.preventDefault();queueScroll(Math.sign(-e.deltaY)*3)},{passive:false});

window.Era={
 title:v=>{document.title=v+' · era for Android'},
 settings:v=>{setting=Object.assign({},setting,v||{});applySettings()},
 error:v=>toast(v)
};
applySettings();connect();wake();
</script></body></html>
